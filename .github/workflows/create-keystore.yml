name: Create signing key (run once)

# SAFETY: this prints the private signing key into the run summary.
# It only runs in a PRIVATE repository. Copy the values into Secrets, then DELETE the run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keygen:
    if: ${{ github.event.repository.private == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore release.jks -alias taghvim \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Taghvim Kari, O=Taghvim Kari, C=IR"
          {
            echo "## Signing key"
            echo "Add these 3 values in Settings > Secrets and variables > Actions, then delete this workflow run."
            echo
            echo "KEYSTORE_PASSWORD: $PASS"
            echo
            echo "KEY_ALIAS: taghvim"
            echo
            echo "KEYSTORE_BASE64:"
            echo '```'
            base64 -w0 release.jks
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
