name: Release APK

# Runs when a tag like v1.2.0 is pushed (or a GitHub Release is published with a new tag).
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android SDK; only the licenses need accepting.
      # (android-actions/setup-android@v3 currently fails: "Failed to find package 'tools'".)
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # With the 3 secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS) the APK is signed with your private key.
      # Without them the old key inside the project is used, so nothing breaks before the secrets are added.
      - name: Use the private signing key (if the secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SECRET_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$SECRET_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${SECRET_ALIAS:-taghvim}" >> "$GITHUB_ENV"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test and build signed release APK
        run: |
          export APP_VERSION_NAME="${GITHUB_REF_NAME#v}"
          gradle testDebugUnitTest assembleRelease

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="taghvim-kari-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$FILE"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$FILE" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$FILE" --title "$GITHUB_REF_NAME" --generate-notes
          fi
