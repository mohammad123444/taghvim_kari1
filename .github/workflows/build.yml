name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android SDK; only the licenses need accepting.
      # (android-actions/setup-android@v3 currently fails: "Failed to find package 'tools'".)
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # With the 3 secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS) the APK is signed with your private key.
      # Without them the old key inside the project is used, so nothing breaks before the secrets are added.
      - name: Use the private signing key (if the secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SECRET_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$SECRET_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${SECRET_ALIAS:-taghvim}" >> "$GITHUB_ENV"
          fi

      # No Gradle wrapper is committed, so use the official action to provide Gradle (also caches dependencies).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        run: gradle testDebugUnitTest

      # A release build is not debuggable, which Google Play Protect trusts far more than a debug APK.
      - name: Build release APK
        run: gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taghvim-kari-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
